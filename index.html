<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayah's Dry Clean and Laundry</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Firebase SDK (Compat scripts for pure browser static hosting) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app" id="app">

    <!-- Loading banner -->
    <div id="loadingBanner" class="loading-banner">Loading laundry records…</div>

    <!-- LocalStorage / Offline mode banner -->
    <div id="dbBanner" class="db-banner" style="display: none;"></div>

    <!-- Topbar Header -->
    <header class="topbar" id="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="36" height="36" rx="10" fill="#1F6F78"/>
          <circle cx="16" cy="16" r="3.5" fill="#F7F9F9"/>
          <path d="M14 30h16M14 24h10" stroke="#F7F9F9" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Ayah's Dry Clean and Laundry</h1>
          <p class="tagline">Track every drop-off, from Received to Released.</p>
        </div>
      </div>
      <button class="icon-btn settings-btn" id="settingsBtn" title="Shop Settings & Pricing" aria-label="Settings">⚙️</button>
    </header>

    <!-- Stats Row -->
    <section class="stats" id="statsSection"></section>

    <!-- New Drop-off Form -->
    <section class="panel" id="formSection">
      <h2>New drop-off</h2>
      <form id="addForm" class="add-form" novalidate></form>
      <p class="hint" id="formHint"></p>
    </section>

    <!-- Transactions Table -->
    <section class="panel table-panel" id="tableSection">
      <div class="table-toolbar" id="tableToolbar"></div>
      <div class="table-wrap">
        <table>
          <thead id="txHead"></thead>
          <tbody id="txBody"></tbody>
        </table>
        <p class="empty-state" id="emptyState"></p>
      </div>
    </section>

    <!-- Reports Section -->
    <section class="panel reports-panel" id="reportsSection"></section>

  </div>

  <!-- Settings Sidebar -->
  <aside class="settings-sidebar" id="settingsSidebar" style="display: none;"></aside>

  <!-- Confirmation Modal Container -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;"></div>

  <!-- Non-blocking Toasts Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Printable Receipt Area (rendered during printing) -->
  <div id="receiptPrintArea" class="receipt-print-area"></div>

  <!-- App Entry Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
