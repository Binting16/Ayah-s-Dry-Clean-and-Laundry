<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayah's Dry Clean and Laundry</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/bir.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Loading State -->
    <div id="loadingBanner" class="loading-banner">Connecting to laundry database…</div>

    <!-- LocalStorage / Offline mode banner -->
    <div id="dbBanner" class="db-banner" style="display: none;"></div>

    <!-- Header Topbar -->
    <header class="topbar" id="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="36" height="36" rx="10" fill="#1F6F78"/>
          <circle cx="16" cy="16" r="3.5" fill="#F7F9F9"/>
          <path d="M14 30h16M14 24h10" stroke="#F7F9F9" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Ayah's Dry Clean and Laundry</h1>
          <p class="tagline">Wash, dry, fold, repeat.</p>
        </div>
      </div>
      <button class="icon-btn settings-btn" id="settingsBtn" title="Shop Settings & Management" aria-label="Settings">⚙️</button>
    </header>

    <!-- COUNTER VIEW (Customer-Facing & Staff Workspace) -->
    <main id="viewLaundryLog">
      <!-- New Drop-off Form with Customer Live Total Display -->
      <section class="panel" id="formSection">
        <h2>New drop-off</h2>
        <form id="addForm" class="add-form" novalidate></form>
        <p class="hint" id="formHint"></p>
      </section>

      <!-- Active & Released Transactions Table -->
      <section class="panel table-panel" id="tableSection">
        <div class="table-toolbar" id="tableToolbar"></div>
        <div class="table-wrap">
          <table>
            <thead id="txHead"></thead>
            <tbody id="txBody"></tbody>
          </table>
          <p class="empty-state" id="emptyState"></p>
        </div>
      </section>
    </main>

    <!-- Discreet Counter Footer & Developer Watermark -->
    <footer class="counter-footer">
      <p class="watermark">Made by Jan Vincent "Binting" Aningat</p>
    </footer>

  </div>

  <!-- BIR & FINANCIAL RECORDS OVERLAY (Opened from Settings drawer) -->
  <div id="viewBirRecords" class="bir-overlay-view" style="display: none;">
    <div class="bir-container">
      <section class="panel bir-panel" id="birSection"></section>
    </div>
  </div>

  <!-- Settings Drawer Sidebar -->
  <aside class="settings-sidebar" id="settingsSidebar" style="display: none;"></aside>

  <!-- Confirmation Modal Container -->
  <div id="modalOverlay" class="modal-overlay" style="display: none;"></div>

  <!-- Non-blocking Toasts Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Printable Receipt Area -->
  <div id="receiptPrintArea" class="receipt-print-area"></div>

  <!-- App Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
